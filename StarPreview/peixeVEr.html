<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stardew Valley Fish JSON Editor & Sprite Viewer</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        stardew: {
                            wood: '#4a2f1b',
                            woodLight: '#6d4c33',
                            woodDark: '#2c190e',
                            gold: '#f4ba3b',
                            goldHover: '#d99e23',
                            panel: '#1e2430',
                            card: '#273043',
                            cardHover: '#2e384e',
                            border: '#3d4b66',
                            accent: '#4e9eff'
                        }
                    },
                    fontFamily: {
                        sans: ['Outfit', 'sans-serif'],
                        mono: ['Fira Code', 'monospace']
                    }
                }
            }
        }
    </script>
    <style>
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #181c25; }
        ::-webkit-scrollbar-thumb { background: #3d4b66; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #f4ba3b; }
        .toast-slide { animation: slideIn 0.3s ease-out forwards; }
        @keyframes slideIn {
            from { transform: translateY(100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .fish-sprite {
            display: inline-block;
            background-repeat: no-repeat !important;
            background-size: 768px auto !important;
            image-rendering: pixelated !important;
            width: 32px !important;
            height: 32px !important;
            flex-shrink: 0;
        }
    </style>
</head>
<body class="bg-[#12161f] text-slate-100 font-sans min-h-screen flex flex-col antialiased selection:bg-stardew-gold selection:text-stardew-woodDark">

    <!-- Header / Navbar -->

            <div class="w-10 h-10 rounded-lg bg-stardew-gold text-stardew-woodDark flex items-center justify-center font-bold text-2xl shadow-inner">
                <i class="fa-solid fa-fish"></i>
            </div>
            <div>
                <h1 class="text-xl font-bold text-stardew-gold tracking-wide leading-tight">Stardew Valley Fish JSON Editor</h1>
                <p class="text-xs text-slate-400">Spritesheet <code class="text-stardew-gold">recursos/objetos1.png</code></p>
            </div>
        </div>

        <div class="flex items-center gap-2 flex-wrap">
            <button onclick="addNewFish()" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 text-white font-medium rounded-lg shadow flex items-center gap-2 transition active:scale-95 text-sm">
                <i class="fa-solid fa-plus"></i> Adicionar Peixe
            </button>

                <i class="fa-solid fa-arrow-down-a-z"></i> Ordenar & Re-indexar IDs
            </button>
            <button onclick="openImportModal()" class="px-4 py-2 bg-stardew-cardHover hover:bg-slate-700 text-slate-200 font-medium rounded-lg border border-stardew-border flex items-center gap-2 transition text-sm">
                <i class="fa-solid fa-file-import"></i> Importar / Raw JSON
            </button>
            <button onclick="exportJSON()" class="px-4 py-2 bg-stardew-gold hover:bg-stardew-goldHover text-stardew-woodDark font-bold rounded-lg shadow flex items-center gap-2 transition active:scale-95 text-sm">
                <i class="fa-solid fa-download"></i> Exportar JSON
            </button>
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-4 md:p-6 lg:p-8 flex flex-col gap-6">

                </div>
            </div>
            <div class="text-xs text-slate-400 flex items-center gap-2">
                <span>Ou selecione o arquivo local:</span>

            </div>

        const AVAILABLE_SEASONS = ['primavera', 'verao', 'outono', 'inverno'];
        const COOKIE_NAME = 'sdv_reviewed_fish';

        function updateSpritePath(newPath) {
            currentSpritePath = newPath;
            renderFishList();
        }

        function loadLocalSpriteSheet(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    currentSpritePath = e.target.result;
                    document.getElementById('spritePathInput').value = "Arquivo carregado localmente";
                    renderFishList();
                    showToast("Spritesheet carregada com sucesso!", "success");
                };
                reader.readAsDataURL(file);
            }
        }

        function setCookie(name, value, days = 365) {
            const d = new Date();
            d.setTime(d.getTime() + (days * 24 * 60 * 60 * 1000));
            document.cookie = `${name}=${encodeURIComponent(value)};expires=${d.toUTCString()};path=/;SameSite=Lax`;
        }

        function getCookie(name) {
            const cname = name + "=";
            const decoded = decodeURIComponent(document.cookie);
            const ca = decoded.split(';');
            for(let c of ca) {
                let trimmed = c.trim();
                if (trimmed.indexOf(cname) === 0) return trimmed.substring(cname.length);
            }
            return "";
        }

        function loadReviewedStateFromCookies() {
            const saved = getCookie(COOKIE_NAME);
            if (saved) {
                try {
                    const ids = JSON.parse(saved);
                    if (Array.isArray(ids)) reviewedFishIds = new Set(ids);
                } catch(e) {}
            }
        }

        function saveReviewedStateToCookies() {
            setCookie(COOKIE_NAME, JSON.stringify(Array.from(reviewedFishIds)), 365);
        }

        window.onload = function() {
            loadReviewedStateFromCookies();
            sortAndReindex(false);
        };

        function sortAndReindex(notify = true) {
            fishData.sort((a, b) => (a.nome || "").localeCompare(b.nome || "", 'pt-BR', { sensitivity: 'base' }));
            fishData.forEach((fish, index) => {
                fish.id = 85 + index;
            });

            renderFishList();
            if (notify) {
                showToast("Lista ordenada alfabeticamente e IDs re-indexados a partir do 85!", "success");
            }
        }

        function formatReadableTime(hora) {
            if (!hora || hora.length === 0) return "Qualquer horário (24h)";
            if (typeof hora[0] === 'string') return `${hora[0]} às ${hora[1]}`;
            if (Array.isArray(hora[0])) return hora.map(slot => `${slot[0]} às ${slot[1]}`).join(" e ");
            return "Qualquer horário";
        }

        function getSpriteStyle(spritePos) {
            if (!spritePos || spritePos === 'null') return 'background-color: #1e2430; width: 32px; height: 32px;';
            return `background-image: url('${currentSpritePath}'); background-position: ${spritePos}; background-repeat: no-repeat !important; background-size: 768px auto !important; image-rendering: pixelated !important; width: 32px !important; height: 32px !important; flex-shrink: 0;`;
        }

        function renderFishList() {
            const container = document.getElementById('fishList');
            const searchQuery = document.getElementById('searchInput').value.toLowerCase().trim();
            const filterOption = document.getElementById('reviewFilter').value;
            container.innerHTML = '';

            const filteredList = fishData.filter(fish => {
                const isReviewed = reviewedFishIds.has(fish.id);
                if (filterOption === 'reviewed' && !isReviewed) return false;
                if (filterOption === 'unreviewed' && isReviewed) return false;

                const matchName = fish.nome.toLowerCase().includes(searchQuery);
                const matchLocal = (fish.local || []).some(l => l.toLowerCase().includes(searchQuery));
                const matchClima = (fish.clima || []).some(c => c.toLowerCase().includes(searchQuery));
                const matchComp = (fish.comportamento || '').toLowerCase().includes(searchQuery);
                return matchName || matchLocal || matchClima || matchComp;
            });

            document.getElementById('totalCount').textContent = filteredList.length;
            document.getElementById('reviewedCount').textContent = `${reviewedFishIds.size} de ${fishData.length}`;

            if (filteredList.length === 0) {
                container.innerHTML = `
                    <div class="bg-stardew-panel border border-stardew-border p-12 text-center rounded-xl text-slate-400">
                        <i class="fa-solid fa-fish-fins text-4xl mb-3 text-slate-600"></i>
                        <p class="text-base font-medium">Nenhum peixe encontrado.</p>
                    </div>
                `;
                return;
            }

            filteredList.forEach(fish => {
                const isExpanded = expandedCards.has(fish.id);
                const isReviewed = reviewedFishIds.has(fish.id);
                const singleLineJSON = JSON.stringify(fish);

                const curaTexto = fish.cura && fish.cura.length === 2 ? `HP: ${fish.cura[0]} | Stamina: ${fish.cura[1]}` : 'Sem dados de cura';

                const card = document.createElement('div');
                card.className = `bg-stardew-card border ${isReviewed ? 'border-emerald-500/80 shadow-emerald-950/20 shadow-lg' : 'border-stardew-border'} rounded-xl shadow-md overflow-hidden transition-all duration-200`;

                card.innerHTML = `
                    <div class="p-4 ${isReviewed ? 'bg-emerald-950/30 hover:bg-emerald-950/50' : 'bg-stardew-cardHover'} flex flex-wrap items-center justify-between gap-3 cursor-pointer select-none" onclick="toggleCard(${fish.id})">
                        <div class="flex items-center gap-3">
                            <div onclick="event.stopPropagation(); toggleReviewed(${fish.id})" class="flex items-center gap-2 pr-2 border-r border-slate-700/60" title="Marcar como Editado">
                                <input type="checkbox" ${isReviewed ? 'checked' : ''} class="w-5 h-5 accent-emerald-500 rounded cursor-pointer">
                            </div>

                            <div class="rounded border border-stardew-border shadow-inner" style="${getSpriteStyle(fish.sprite)}" title="Sprite: ${fish.sprite}"></div>

                            <span class="w-8 h-8 rounded-lg bg-stardew-woodDark text-stardew-gold font-mono font-bold flex items-center justify-center text-xs border border-stardew-border">
                                #${fish.id}
                            </span>
                            <div>
                                <h3 class="font-bold text-slate-100 text-base capitalize flex items-center gap-2">
                                    ${fish.nome || '<span class="text-slate-500 italic">Sem nome</span>'}
                                    <span class="text-xs px-2 py-0.5 rounded bg-blue-950 text-blue-300 font-normal border border-blue-800">
                                        ${(fish.tipo || ['peixe']).join(', ')}
                                    </span>
                                    ${isReviewed ? '<span class="text-xs px-2 py-0.5 rounded-full bg-emerald-900 text-emerald-300 border border-emerald-600 font-medium flex items-center gap-1"><i class="fa-solid fa-check text-[10px]"></i> Editado</span>' : ''}
                                </h3>
                                <div class="flex items-center gap-2 text-xs text-slate-400 mt-0.5">
                                    <span><i class="fa-solid fa-coins text-stardew-gold"></i> ${fish.valorBase !== null ? fish.valorBase + 'g' : 'null'}</span>
                                    <span>•</span>
                                    <span><i class="fa-solid fa-heart-pulse text-red-400"></i> ${curaTexto}</span>
                                    <span>•</span>
                                    <span><i class="fa-solid fa-gauge-high text-amber-400"></i> Dif: ${fish.dificuldade !== null ? fish.dificuldade : 'null'}</span>
                                    <span>•</span>
                                    <span><i class="fa-solid fa-person-running text-purple-400"></i> ${fish.comportamento || 'misto'}</span>
                                </div>
                            </div>
                        </div>

                        <div class="flex items-center gap-2">
                            <div class="hidden sm:flex gap-1">
                                ${renderSeasonBadges(fish.estacao)}
                            </div>
                            <button onclick="event.stopPropagation(); deleteFish(${fish.id})" class="p-2 text-slate-400 hover:text-red-400 transition" title="Excluir">
                                <i class="fa-solid fa-trash-can"></i>
                            </button>
                            <span class="text-slate-400 text-sm ml-1 transform transition-transform duration-200 ${isExpanded ? 'rotate-180' : ''}">
                                <i class="fa-solid fa-chevron-down"></i>
                            </span>
                        </div>
                    </div>

                    <div class="${isExpanded ? 'block' : 'hidden'} p-5 border-t border-stardew-border bg-slate-900/50 space-y-5">
                        <div class="p-3 bg-slate-950 rounded-lg border border-stardew-border flex items-center justify-between">
                            <label class="flex items-center gap-2 cursor-pointer text-xs font-semibold ${isReviewed ? 'text-emerald-400' : 'text-slate-300'}">
                                <input type="checkbox" ${isReviewed ? 'checked' : ''} onchange="toggleReviewed(${fish.id})" class="w-4 h-4 accent-emerald-500 rounded cursor-pointer">
                                <span>Registro verificado / alterado com sucesso</span>
                            </label>
                            <span class="text-[11px] text-slate-500 italic">Salvo nos Cookies do navegador</span>
                        </div>

                        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                            <div>
                                <label class="block text-xs font-semibold text-slate-300 mb-1">ID (Gerado Automaticamente)</label>
                                <input type="number" readonly value="${fish.id}" class="w-full bg-slate-950/60 text-slate-400 px-3 py-2 rounded-lg border border-stardew-border text-sm font-mono cursor-not-allowed">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-300 mb-1">Nome do Peixe</label>
                                <input type="text" value="${escapeHtml(fish.nome || '')}" onchange="updateFishField(${fish.id}, 'nome', this.value)" class="w-full bg-slate-950 text-slate-100 px-3 py-2 rounded-lg border border-stardew-border focus:border-stardew-gold focus:outline-none text-sm">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-300 mb-1">Valor Base (Ouro)</label>
                                <input type="number" placeholder="null" value="${fish.valorBase !== null ? fish.valorBase : ''}" onchange="updateFishField(${fish.id}, 'valorBase', this.value === '' ? null : parseInt(this.value))" class="w-full bg-slate-950 text-slate-100 px-3 py-2 rounded-lg border border-stardew-border focus:border-stardew-gold focus:outline-none text-sm font-mono">
                            </div>
                        </div>

                        <!-- Linha de Cura [HP, Stamina] -->
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 bg-slate-950/80 p-3 rounded-lg border border-stardew-border">
                            <div>
                                <label class="block text-xs font-semibold text-red-400 mb-1"><i class="fa-solid fa-heart"></i> Cura HP (1ª Posição)</label>
                                <input type="number" value="${fish.cura && fish.cura.length === 2 ? fish.cura[0] : ''}" placeholder="ex: 17" onchange="updateCuraField(${fish.id}, 0, this.value)" class="w-full bg-slate-900 text-slate-100 px-3 py-2 rounded-lg border border-stardew-border focus:border-stardew-gold focus:outline-none text-sm font-mono">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-emerald-400 mb-1"><i class="fa-solid fa-bolt"></i> Cura Stamina / Energia (2ª Posição)</label>
                                <input type="number" value="${fish.cura && fish.cura.length === 2 ? fish.cura[1] : ''}" placeholder="ex: 38" onchange="updateCuraField(${fish.id}, 1, this.value)" class="w-full bg-slate-900 text-slate-100 px-3 py-2 rounded-lg border border-stardew-border focus:border-stardew-gold focus:outline-none text-sm font-mono">
                            </div>
                        </div>

                        <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                            <div>
                                <label class="block text-xs font-semibold text-slate-300 mb-1">Comportamento</label>
                                <input type="text" value="${escapeHtml(fish.comportamento || '')}" placeholder="ex: dardo, suave, misto" onchange="updateFishField(${fish.id}, 'comportamento', this.value)" class="w-full bg-slate-950 text-slate-100 px-3 py-2 rounded-lg border border-stardew-border focus:border-stardew-gold focus:outline-none text-sm">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-300 mb-1">Dificuldade (Inteiro)</label>
                                <input type="number" value="${fish.dificuldade !== null ? fish.dificuldade : ''}" placeholder="null" onchange="updateFishField(${fish.id}, 'dificuldade', this.value === '' ? null : parseInt(this.value))" class="w-full bg-slate-950 text-slate-100 px-3 py-2 rounded-lg border border-stardew-border focus:border-stardew-gold focus:outline-none text-sm font-mono">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-300 mb-1">Tipo</label>
                                <input type="text" value="${(fish.tipo || []).join(', ')}" onchange="updateArrayField(${fish.id}, 'tipo', this.value)" class="w-full bg-slate-950 text-slate-100 px-3 py-2 rounded-lg border border-stardew-border focus:border-stardew-gold focus:outline-none text-sm">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-300 mb-1">Sprite (Offset -Xpx -Ypx)</label>
                                <input type="text" value="${escapeHtml(fish.sprite || 'null')}" onchange="updateFishField(${fish.id}, 'sprite', this.value)" class="w-full bg-slate-950 text-slate-100 px-3 py-2 rounded-lg border border-stardew-border focus:border-stardew-gold focus:outline-none text-sm font-mono">
                            </div>
                        </div>

                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div>
                                <label class="block text-xs font-semibold text-slate-300 mb-1">Locais onde é encontrado</label>
                                <input type="text" value="${(fish.local || []).join(', ')}" onchange="updateArrayField(${fish.id}, 'local', this.value)" placeholder="ex: oceano, lago da montanha" class="w-full bg-slate-950 text-slate-100 px-3 py-2 rounded-lg border border-stardew-border focus:border-stardew-gold focus:outline-none text-sm">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-300 mb-1">Clima Exigido</label>
                                <input type="text" value="${(fish.clima || []).join(', ')}" onchange="updateArrayField(${fish.id}, 'clima', this.value)" placeholder="ex: chuva, sol" class="w-full bg-slate-950 text-slate-100 px-3 py-2 rounded-lg border border-stardew-border focus:border-stardew-gold focus:outline-none text-sm">
                            </div>
                        </div>

                        <div>
                            <label class="block text-xs font-semibold text-slate-300 mb-2">Estações Disponíveis</label>
                            <div class="flex flex-wrap gap-2">
                                ${AVAILABLE_SEASONS.map(season => {
                                    const active = (fish.estacao || []).includes(season);
                                    return `
                                        <button onclick="toggleSeason(${fish.id}, '${season}')" class="px-3 py-1 rounded-lg text-xs font-medium border transition flex items-center gap-1.5 ${
                                            active ? getSeasonStyle(season) : 'bg-slate-950 border-slate-700 text-slate-500 hover:border-slate-500'
                                        }">
                                            <i class="fa-solid ${active ? 'fa-square-check' : 'fa-square'}"></i> ${capitalize(season)}
                                        </button>
                                    `;
                                }).join('')}
                            </div>
                        </div>

                        <div class="bg-slate-950 p-4 rounded-lg border border-stardew-border space-y-3">
                            <div class="flex justify-between items-center">
                                <label class="text-xs font-semibold text-stardew-gold flex items-center gap-2">
                                    <i class="fa-solid fa-clock"></i> Horários de Pesca
                                </label>
                                <div class="flex gap-2">
                                    <button onclick="setAllDayTime(${fish.id})" class="text-xs px-2.5 py-1 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded border border-slate-700 transition">
                                        Livre (24h)
                                    </button>
                                    <button onclick="addTimeSlot(${fish.id})" class="text-xs px-2.5 py-1 bg-stardew-woodLight hover:bg-stardew-wood text-white font-medium rounded transition flex items-center gap-1">
                                        <i class="fa-solid fa-plus text-[10px]"></i> Adicionar Turno
                                    </button>
                                </div>
                            </div>
                            <div class="space-y-2">
                                ${renderTimeSlotInputs(fish)}
                            </div>
                            <div class="text-[11px] text-slate-400 italic">
                                Preview: <strong class="text-slate-200">${formatReadableTime(fish.hora)}</strong>
                            </div>
                        </div>

                        <div>
                            <div class="flex justify-between items-center mb-1">
                                <label class="text-[11px] font-mono text-slate-400">JSON Linha Única:</label>
                                <button onclick="copyToClipboard('${escapeJsString(singleLineJSON)}')" class="text-[11px] text-stardew-gold hover:underline flex items-center gap-1">
                                    <i class="fa-regular fa-copy"></i> Copiar Linha
                                </button>
                            </div>
                            <input type="text" readonly value="${escapeHtml(singleLineJSON)}" class="w-full bg-slate-950 text-emerald-400 font-mono text-xs px-3 py-2 rounded-lg border border-slate-800 select-all focus:outline-none">
                        </div>

                    </div>
                `;
                container.appendChild(card);
            });
        }

        function updateCuraField(id, index, val) {
            const fish = fishData.find(f => f.id === id);
            if (fish) {
                if (!fish.cura || fish.cura.length !== 2) {
                    fish.cura = [0, 0];
                }
                fish.cura[index] = val === '' ? 0 : parseInt(val);
                renderFishList();
            }
        }

        function toggleReviewed(id) {
            if (reviewedFishIds.has(id)) reviewedFishIds.delete(id);
            else reviewedFishIds.add(id);
            saveReviewedStateToCookies();
            renderFishList();
        }

        function clearAllReviewed() {
            if (reviewedFishIds.size === 0) return;
            reviewedFishIds.clear();
            saveReviewedStateToCookies();
            renderFishList();
            showToast("Todas as marcações foram limpas.", "info");
        }

        function renderSeasonBadges(seasons) {
            if (!seasons || seasons.length === 0) return `<span class="text-[10px] bg-slate-800 text-slate-400 px-2 py-0.5 rounded">Todas</span>`;
            return seasons.map(s => `<span class="text-[10px] px-2 py-0.5 rounded font-medium ${getSeasonBadgeStyle(s)}">${capitalize(s)}</span>`).join('');
        }

        function getSeasonStyle(season) {
            switch(season) {
                case 'primavera': return 'bg-emerald-950 border-emerald-600 text-emerald-300';
                case 'verao': return 'bg-amber-950 border-amber-600 text-amber-300';
                case 'outono': return 'bg-orange-950 border-orange-600 text-orange-300';
                case 'inverno': return 'bg-cyan-950 border-cyan-600 text-cyan-300';
                default: return 'bg-slate-800 border-slate-600 text-slate-300';
            }
        }

        function getSeasonBadgeStyle(season) {
            switch(season) {
                case 'primavera': return 'bg-emerald-900/60 text-emerald-300 border border-emerald-700/50';
                case 'verao': return 'bg-amber-900/60 text-amber-300 border border-amber-700/50';
                case 'outono': return 'bg-orange-900/60 text-orange-300 border border-orange-700/50';
                case 'inverno': return 'bg-cyan-900/60 text-cyan-300 border border-cyan-700/50';
                default: return 'bg-slate-800 text-slate-300';
            }
        }

        function renderTimeSlotInputs(fish) {
            const hora = fish.hora;
            if (!hora || hora.length === 0) return `<div class="text-xs text-slate-400 italic bg-slate-900 p-2 rounded border border-slate-800">Sem restrição de horário.</div>`;

            let slots = [];
            if (typeof hora[0] === 'string') slots = [hora];
            else if (Array.isArray(hora[0])) slots = hora;

            return slots.map((slot, index) => `
                <div class="flex items-center gap-2 bg-slate-900 p-2 rounded border border-slate-800">
                    <span class="text-xs text-slate-400 font-mono">Turno ${index + 1}:</span>
                    <input type="text" value="${slot[0] || '06:00'}" onchange="updateTimeSlot(${fish.id}, ${index}, 0, this.value)" class="bg-slate-950 text-slate-100 font-mono text-xs px-2 py-1 rounded border border-stardew-border w-24 text-center">
                    <span class="text-xs text-slate-400">até</span>
                    <input type="text" value="${slot[1] || '19:00'}" onchange="updateTimeSlot(${fish.id}, ${index}, 1, this.value)" class="bg-slate-950 text-slate-100 font-mono text-xs px-2 py-1 rounded border border-stardew-border w-24 text-center">
                    <button onclick="removeTimeSlot(${fish.id}, ${index})" class="text-slate-500 hover:text-red-400 text-xs px-2 py-1 transition ml-auto" title="Remover Turno">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </div>
            `).join('');
        }

        function toggleCard(id) {
            if (expandedCards.has(id)) expandedCards.delete(id);
            else expandedCards.add(id);
            renderFishList();
        }

        function expandAllCards(expand) {
            if (expand) fishData.forEach(f => expandedCards.add(f.id));
            else expandedCards.clear();
            renderFishList();
        }

        function updateFishField(id, field, value) {
            const fish = fishData.find(f => f.id === id);
            if (fish) {
                fish[field] = value;
                if (field === 'nome') {
                    sortAndReindex(false);
                } else {
                    renderFishList();
                }
            }
        }

        function updateArrayField(id, field, rawText) {
            const fish = fishData.find(f => f.id === id);
            if (fish) {
                fish[field] = rawText.split(',').map(s => s.trim()).filter(s => s.length > 0);
                renderFishList();
            }
        }

        function toggleSeason(id, season) {
            const fish = fishData.find(f => f.id === id);
            if (fish) {
                if (!fish.estacao) fish.estacao = [];
                const idx = fish.estacao.indexOf(season);
                if (idx > -1) fish.estacao.splice(idx, 1);
                else fish.estacao.push(season);
                renderFishList();
            }
        }

        function setAllDayTime(id) {
            const fish = fishData.find(f => f.id === id);
            if (fish) { fish.hora = []; renderFishList(); }
        }

        function addTimeSlot(id) {
            const fish = fishData.find(f => f.id === id);
            if (fish) {
                if (!fish.hora || fish.hora.length === 0) fish.hora = ["06:00", "19:00"];
                else if (typeof fish.hora[0] === 'string') fish.hora = [[fish.hora[0], fish.hora[1]], ["18:00", "02:00"]];
                else if (Array.isArray(fish.hora[0])) fish.hora.push(["06:00", "19:00"]);
                renderFishList();
            }
        }

        function removeTimeSlot(id, index) {
            const fish = fishData.find(f => f.id === id);
            if (fish) {
                if (typeof fish.hora[0] === 'string') fish.hora = [];
                else if (Array.isArray(fish.hora[0])) {
                    fish.hora.splice(index, 1);
                    if (fish.hora.length === 1) fish.hora = fish.hora[0];
                }
                renderFishList();
            }
        }

        function updateTimeSlot(id, slotIdx, timeIdx, val) {
            const fish = fishData.find(f => f.id === id);
            if (fish) {
                if (typeof fish.hora[0] === 'string') fish.hora[timeIdx] = val;
                else if (Array.isArray(fish.hora[0])) fish.hora[slotIdx][timeIdx] = val;
                renderFishList();
            }
        }

        function addNewFish() {
            const newFishName = prompt("Digite o nome do novo peixe:", "enguia de lava") || "novo peixe";
            
            const newFish = {
                id: 0,
                nome: newFishName.toLowerCase().trim(),
                tipo: ["peixe"],
                valorBase: 100,
                local: ["oceano"],
                estacao: ["primavera"],
                hora: ["06:00", "19:00"],
                clima: [],
                sprite: "null",
                comportamento: "misto",
                dificuldade: 50,
                cura: [17, 38]
            };
            
            fishData.push(newFish);
            sortAndReindex(false);
            expandedCards.add(newFish.id);
            renderFishList();
            showToast(`Peixe "${newFish.nome}" adicionado na ordem alfabética!`, "success");
        }

        function deleteFish(id) {
            fishData = fishData.filter(f => f.id !== id);
            expandedCards.delete(id);
            sortAndReindex(false);
            showToast("Peixe removido e IDs reorganizados.", "info");
        }

        function filterFish() { renderFishList(); }

        function exportJSON() {
            sortAndReindex(false);
            const formattedLines = fishData.map(fish => JSON.stringify(fish));
            const jsonText = "[\n  " + formattedLines.join(",\n  ") + "\n]";
            copyToClipboard(jsonText);
            showToast("JSON exportado e copiado para a área de transferência!", "success");
        }

        function openImportModal() {
            sortAndReindex(false);
            const formattedLines = fishData.map(fish => JSON.stringify(fish));
            document.getElementById('jsonRawTextArea').value = "[\n  " + formattedLines.join(",\n  ") + "\n]";
            document.getElementById('importModal').classList.remove('hidden');
        }

        function closeImportModal() { document.getElementById('importModal').classList.add('hidden'); }

        function applyRawJSON() {
            const rawText = document.getElementById('jsonRawTextArea').value;
            try {
                const parsed = JSON.parse(rawText);
                if (Array.isArray(parsed)) {
                    fishData = parsed;
                    sortAndReindex(false);
                    closeImportModal();
                    showToast("Dados atualizados via JSON!", "success");
                } else showToast("O JSON deve ser um array [...]", "error");
            } catch (err) {
                showToast("Erro no JSON: " + err.message, "error");
            }
        }

        function loadDefaultJSON() {
            fishData = JSON.parse(JSON.stringify(INITIAL_FISH_DATA));
            sortAndReindex(false);
            openImportModal();
            showToast("Dados restaurados para o padrão original.", "info");
        }

        function copyRawJSON() {
            copyToClipboard(document.getElementById('jsonRawTextArea').value);
            showToast("JSON copiado!", "success");
        }

        function copyToClipboard(text) {
            const dummy = document.createElement("textarea");
            document.body.appendChild(dummy);
            dummy.value = text;
            dummy.select();
            document.execCommand("copy");
            document.body.removeChild(dummy);
        }

        function showToast(message, type = "info") {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            let bgClass = "bg-slate-800 border-slate-700 text-white";
            if (type === "success") bgClass = "bg-emerald-900 border-emerald-600 text-emerald-100";
            if (type === "error") bgClass = "bg-red-900 border-red-600 text-red-100";

            toast.className = `px-4 py-3 rounded-lg border shadow-xl text-sm flex items-center gap-2 font-medium toast-slide ${bgClass}`;
            toast.innerHTML = `<i class="fa-solid ${type === 'success' ? 'fa-check' : 'fa-circle-info'}"></i> ${message}`;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transition = 'opacity 0.3s ease';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        function capitalize(str) { return str ? str.charAt(0).toUpperCase() + str.slice(1) : ''; }
        function escapeHtml(str) { return typeof str === 'string' ? str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;") : str; }
        function escapeJsString(str) { return str.replace(/\\/g, '\\\\').replace(/'/g, "\\'"); }
    </script>
</body>
</html>
