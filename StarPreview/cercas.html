<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Stardew Fence Mapper</title>
    <style>
        body { font-family: sans-serif; background: #222; color: #fff; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .container { display: flex; gap: 40px; background: #333; padding: 20px; border-radius: 8px; border: 2px solid #555; }
        #canvas-container { position: relative; border: 1px solid red; image-rendering: pixelated; background: url('https://www.transparenttextures.com/patterns/carbon-fibre.png'); cursor: crosshair; }
        canvas { display: block; zoom: 2; }
        .controls { width: 350px; display: flex; flex-direction: column; gap: 10px; }
        .state-row { display: flex; align-items: center; gap: 10px; background: #444; padding: 5px; border-radius: 4px; cursor: pointer; border: 2px solid transparent; }
        .state-row.active { border-color: #f0ad4e; background: #555; }
        .state-row span { font-size: 12px; flex-grow: 1; }
        .preview-box { width: 16px; height: 32px; background: #000; border: 1px solid #777; zoom: 1; overflow: hidden; position: relative; }
        .preview-img { position: absolute; top:0; left:0; width: auto; height: auto; }
        #output { width: 90%; height: 200px; margin-top: 20px; background: #111; color: #0f0; font-family: monospace; padding: 10px; }
    </style>
</head>
<body>

    <h1>Stardew Fence Mapper</h1>
    <p>1. Carregue a imagem | 2. Selecione um estado na direita | 3. Clique na quina superior do sprite na imagem</p>
    
    <input type="file" id="file-input" style="margin-bottom: 20px;">

    <div class="container">
        <div id="canvas-container">
            <canvas id="sprite-canvas"></canvas>
        </div>

        <div class="controls" id="states-list">
            <!-- Gerado via JS -->
        </div>
    </div>

    <textarea id="output" readonly placeholder="O código CSS e JS aparecerá aqui..."></textarea>

    <script>
        const states = [
            { id: 0,  label: "Isolada", mask: "1-1" },
            { id: 1,  label: "Vertical Topo", mask: "0-1" },
            { id: 2,  label: "Vertical Meio", mask: "0-0" },
            { id: 3,  label: "Vertical Base", mask: "2-1" },
            { id: 4,  label: "Horiz. Extre. Esquerda", mask: "0-2" },
            { id: 5,  label: "Horiz. Meio", mask: "1-2" },
            { id: 6,  label: "Horiz. Extre. Direita", mask: "2-2" },
            { id: 7,  label: "Quina TL (┌)", mask: "quina-tl" },
            { id: 8,  label: "Quina TR (┐)", mask: "quina-tr" },
            { id: 9,  label: "Quina BL (└)", mask: "quina-bl" },
            { id: 10, label: "Quina BR (┘)", mask: "quina-br" },
            { id: 11, label: "T-Junction (┴)", mask: "t-up" },
            { id: 12, label: "T-Junction (┬)", mask: "t-down" },
            { id: 13, label: "Portão Horizontal", mask: "0-4" },
            { id: 14, label: "Portão Vertical", mask: "0-5" }
        ];

        let activeState = 0;
        let mapping = {};
        const canvas = document.getElementById('sprite-canvas');
        const ctx = canvas.getContext('2d');
        let img = new Image();

        // Inicializar Lista
        const list = document.getElementById('states-list');
        states.forEach(s => {
            const div = document.createElement('div');
            div.className = `state-row ${s.id === 0 ? 'active' : ''}`;
            div.onclick = () => {
                document.querySelectorAll('.state-row').forEach(r => r.classList.remove('active'));
                div.classList.add('active');
                activeState = s.id;
            };
            div.innerHTML = `<span>${s.label} (${s.mask})</span> <div class="preview-box"><img id="prev-${s.id}" class="preview-img"></div>`;
            list.appendChild(div);
        });

        document.getElementById('file-input').onchange = (e) => {
            const reader = new FileReader();
            reader.onload = (event) => {
                img.onload = () => {
                    canvas.width = img.width;
                    canvas.height = img.height;
                    ctx.drawImage(img, 0, 0);
                    drawGrid();
                    states.forEach(s => document.getElementById(`prev-${s.id}`).src = img.src);
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(e.target.files[0]);
        };

        function drawGrid() {
            ctx.strokeStyle = "rgba(255,0,0,0.5)";
            ctx.lineWidth = 0.5;
            for(let x=0; x<canvas.width; x+=16) { ctx.moveTo(x,0); ctx.lineTo(x, canvas.height); }
            for(let y=0; y<canvas.height; y+=16) { ctx.moveTo(0,y); ctx.lineTo(canvas.width, y); }
            ctx.stroke();
        }

        canvas.onclick = (e) => {
            const rect = canvas.getBoundingClientRect();
            const scale = canvas.width / rect.width;
            const x = Math.floor(((e.clientX - rect.left) * scale) / 16) * 16;
            const y = Math.floor(((e.clientY - rect.top) * scale) / 16) * 16;

            mapping[activeState] = { x, y };
            
            const prev = document.getElementById(`prev-${activeState}`);
            prev.style.left = `-${x}px`;
            prev.style.top = `-${y}px`;

            generateCode();
        };

        function generateCode() {
            let css = `/* --- CSS GERADO (assets.css) --- */\n`;
            states.forEach(s => {
                if(mapping[s.id]) {
                    css += `.fmask-${s.mask} { background-position: -${mapping[s.id].x}px -${mapping[s.id].y}px !important; }\n`;
                }
            });

            let js = `\n/* --- JS GERADO (farmPlanner.js) --- */
recalcularConexaoCerca: function(x, y, tipoCerca) {
    const configAlvo = this.objetosConfig[tipoCerca];
    if (!configAlvo || !configAlvo.material) return;
    const mat = configAlvo.material;

    const atualizar = (cx, cy) => {
        const alvo = this.estado.objetos.find(o => o.x === cx && o.y === cy && o.tipo.startsWith(mat));
        if (!alvo) return;

        const n = this.estado.objetos.some(o => o.x === cx && o.y === cy - 1 && o.tipo.startsWith(mat));
        const s = this.estado.objetos.some(o => o.x === cx && o.y === cy + 1 && o.tipo.startsWith(mat));
        const e = this.estado.objetos.some(o => o.x === cx + 1 && o.y === cy && o.tipo.startsWith(mat));
        const w = this.estado.objetos.some(o => o.x === cx - 1 && o.y === cy && o.tipo.startsWith(mat));

        if (this.objetosConfig[alvo.tipo].subtipo === 'g') {
            alvo.fmask = (n || s) ? "0-5" : "0-4";
        } else {
            // Lógica de Bitmask baseada na sua seleção
            if (n && s) alvo.fmask = "0-0";
            else if (s) alvo.fmask = "0-1";
            else if (n) alvo.fmask = "2-1";
            else if (e && w) alvo.fmask = "1-2";
            else if (e) alvo.fmask = "0-2";
            else if (w) alvo.fmask = "2-2";
            else if (n && e) alvo.fmask = "quina-bl"; // Exemplo
            else alvo.fmask = "1-1";
        }
    };
    [[x,y],[x,y-1],[x,y+1],[x+1,y],[x-1,y]].forEach(([nx,ny]) => atualizar(nx,ny));
}`;
            document.getElementById('output').value = css + js;
        }
    </script>
</body>
</html>
